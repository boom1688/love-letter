<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 รักนะ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe0eb 0%, #fce4ec 40%, #f8bbd0 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", sans-serif; overflow: hidden; position: relative;
  }
  .floating-hearts { position: fixed; width: 100%; height: 100%; pointer-events: none; overflow: hidden; top: 0; left: 0; z-index: 0; }
  .heart-float { position: absolute; opacity: 0; animation: floatUp 5s ease-in infinite; }
  @keyframes floatUp { 0%{opacity:0;transform:translateY(0) scale(0.5) rotate(-10deg)} 20%{opacity:.9} 80%{opacity:.3} 100%{opacity:0;transform:translateY(-300px) scale(1.3) rotate(10deg)} }
  .scene { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; position: relative; z-index: 1; }
  .envelope-wrapper { cursor: pointer; position: relative; transition: transform 0.3s; filter: drop-shadow(0 10px 30px rgba(200,80,110,0.3)); }
  .envelope-wrapper:hover { transform: scale(1.05) rotate(-1deg); }
  .envelope-wrapper:active { transform: scale(0.97); }
  .envelope svg { width: 320px; }
  .stamp { position: absolute; top: -14px; right: -14px; width: 48px; height: 48px; background: #fce4ec; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .hint { font-size: 15px; color: #c2607a; animation: pulse 2s ease-in-out infinite; text-align: center; }
  @keyframes pulse { 0%,100%{opacity:.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.05)} }
  .sticker-row { display: flex; gap: 8px; justify-content: center; font-size: 18px; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,180,200,.5); backdrop-filter: blur(6px); align-items: center; justify-content: center; z-index: 200; }
  .modal-overlay.open { display: flex; animation: fadeIn .4s ease; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .letter-card { background: #fffaf8; border-radius: 24px; padding: 2rem 1.8rem; max-width: 360px; width: 92%; text-align: center; box-shadow: 0 24px 70px rgba(200,80,100,.25); animation: popUp .5s cubic-bezier(.17,.67,.35,1.3); border: 1.5px solid rgba(220,120,140,.25); }
  @keyframes popUp { from{opacity:0;transform:translateY(50px) scale(.85)} to{opacity:1;transform:translateY(0) scale(1)} }
  .letter-photo { width: 190px; height: 190px; border-radius: 50%; object-fit: cover; object-position: center top; border: 5px solid #f9c6d0; margin: 0 auto 1.2rem; display: block; box-shadow: 0 6px 24px rgba(220,100,120,.25); }
  .hearts-row { font-size: 24px; margin-bottom: .6rem; letter-spacing: 6px; }
  .letter-title { font-size: 36px; color: #d4607a; margin-bottom: .8rem; font-weight: 700; letter-spacing: 4px; }
  .letter-text { font-size: 16px; color: #a05070; line-height: 2; margin-bottom: 1.5rem; }
  .close-btn { background: #f9c6d0; border: none; border-radius: 50px; padding: 10px 32px; font-size: 15px; color: #a0506a; cursor: pointer; transition: background .2s, transform .1s; font-family: inherit; }
  .close-btn:hover { background: #f5a8ba; transform: scale(1.03); }
  .confetti-piece { position: fixed; width: 10px; height: 10px; border-radius: 2px; pointer-events: none; animation: confettiFall linear forwards; z-index: 300; }
  @keyframes confettiFall { 0%{opacity:1;transform:translateY(0) rotate(0)} 100%{opacity:0;transform:translateY(600px) rotate(720deg)} }
</style>
</head>

    <div class="letter-title">รักนะ ❤️</div>
    <p class="letter-text">เธอคือแสงสว่างที่ทำให้วันของฉัน<br>สวยงามเสมอ ขอบคุณที่อยู่ในชีวิตฉัน<br>รักเธอมากๆ นะ 🌸</p>
    <div class="sticker-row" style="margin-bottom:1.2rem"><span>🌷</span><span>🎀</span><span>🍓</span><span>🎀</span><span>🌷</span></div>
    <button class="close-btn" onclick="closeLetter()">ปิดซอง 💌</button>
  </div>
</div>
<script>
  const hearts=["💗","💕","💖","💓","🌸","🌷","🎀","✨"];
  const container=document.getElementById("heartsContainer");
  function spawnHeart(){
    const el=document.createElement("div");
    el.className="heart-float";
    el.textContent=hearts[Math.floor(Math.random()*hearts.length)];
    el.style.left=(5+Math.random()*90)+"%";
    el.style.bottom="-30px";
    el.style.animationDuration=(4+Math.random()*3)+"s";
    el.style.fontSize=(14+Math.random()*14)+"px";
    container.appendChild(el);
    setTimeout(()=>el.remove(),8000);
  }
  setInterval(spawnHeart,700);
  for(let i=0;i<6;i++) setTimeout(spawnHeart,i*200);

  function openLetter(){
    document.getElementById("letterModal").classList.add("open");
    launchConfetti();
    for(let i=0;i<10;i++) setTimeout(spawnHeart,i*150);
  }
  function closeLetter(){
    document.getElementById("letterModal").classList.remove("open");
  }
  function handleOverlayClick(e){
    if(e.target===document.getElementById("letterModal")) closeLetter();
  }
  function launchConfetti(){
    const colors=["#f9c6d0","#f5a8ba","#fce4ec","#ffcdd2","#d4607a","#fff176","#b2ebf2"];
    for(let i=0;i<50;i++){
      setTimeout(()=>{
        const el=document.createElement("div");
        el.className="confetti-piece";
        el.style.left=(10+Math.random()*80)+"%";
        el.style.top="-10px";
        el.style.background=colors[Math.floor(Math.random()*colors.length)];
        el.style.animationDuration=(1.5+Math.random()*2)+"s";
        document.body.appendChild(el);
        setTimeout(()=>el.remove(),4000);
      },i*40);
    }
  }
</script>
